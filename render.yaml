# Blueprint de Render: crea la base de datos y la aplicación con un clic.
# En render.com → New → Blueprint → elige este repositorio → Apply.
# Plan gratis: la app "duerme" tras 15 min sin visitas (la primera carga tarda ~1 min)
# y la base de datos gratuita vence a los 30 días (luego se crea otra o se pasa a un plan pago).
databases:
  - name: aluna-db
    plan: free
    databaseName: sabia
    user: sabia

services:
  - type: web
    name: aluna-sabia-ceiba
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aluna-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Sin selector de perfiles ni entrada demo sin contraseña en producción.
      - key: ENABLE_DEMO_PROFILES
        value: "false"
      # Clave de las cuentas de prueba del equipo evaluador: Render la genera y se consulta en
      # Dashboard → aluna-sabia-ceiba → Environment. Se comparte solo con quien evalúa.
      - key: DEMO_PASSWORD
        generateValue: true
      - key: ENABLE_DOCS
        value: "false"
      - key: SEED_ON_START
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
